services:
  jdownloader:
    image: antlafarge/jdownloader:latest
    container_name: jdownloader
    restart: unless-stopped
    environment:
      JD_EMAIL: ${JD_EMAIL}
      JD_PASSWORD: ${JD_PASSWORD}
      JD_DEVICENAME: ${JD_DEVICENAME:-MyJDownloader}
    volumes:
      - ./downloads:/downloads
      - jd_config:/opt/JDownloader/cfg

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: jd-telegram-bot
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      JD_EMAIL: ${JD_EMAIL}
      JD_PASSWORD: ${JD_PASSWORD}
      JD_DEVICENAME: ${JD_DEVICENAME:-MyJDownloader}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      DOWNLOADS_PATH: /downloads
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
    volumes:
      - ./downloads:/downloads
    depends_on:
      - jdownloader

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: jd-mini-app-api
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      JD_EMAIL: ${JD_EMAIL}
      JD_PASSWORD: ${JD_PASSWORD}
      JD_DEVICENAME: ${JD_DEVICENAME:-MyJDownloader}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      DOWNLOADS_PATH: /downloads
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - ./downloads:/downloads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - jdownloader

  web:
    build: ./web
    container_name: jd-mini-app-web
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  jd_config:
